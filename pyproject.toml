[project]
name = "tvp"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "flagembedding==1.3.3",
    "groundingdino",
    "httpx==0.27.2",
    "huggingface-hub>=0.36.2",
    "matplotlib>=3.10.9",
    "ninja>=1.13.2",
    "numpy==2.2.6",
    "openai==1.51.2",
    "opencv-python>=5.0.0.93",
    "peft==0.13.2",
    "pillow>=12.3.0",
    "rich>=15.0.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "sentence-transformers==3.1.1",
    "setuptools>=78.1.0",
    "timm==1.0.10",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "torchvision==0.20.1",
    "tqdm>=4.70.1",
    "transformers==4.44.2",
    "unidepth",
    "wheel>=0.48.0",
    "xformers==0.0.28.post3",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
xformers = { index = "pytorch-cu124" }
groundingdino = { path = "models/GroundingDINO", editable = true }
unidepth = { path = "models/UniDepth", editable = true }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.17.1",
]

[tool.uv]
no-build-isolation-package = ["groundingdino"]
